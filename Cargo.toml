[workspace]
resolver = "3"
members = ["app", "analytics/bench"]
# `cargo build` and `cargo run` at the root build only the demo app; the
# analytics benchmark is heavier (wasmtime, Delta Lake, DataFusion) and is
# built by its own recipe, `just analytics-bench`.
default-members = ["app"]
# The analytics plugins build for wasm32-wasip2, each as its own workspace.
exclude = ["analytics/plugins"]
